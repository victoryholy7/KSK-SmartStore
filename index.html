  <script>

    var state = {token:localStorage.getItem("material_token") || "",user:null,settings:null,items:[],page:"dashboard",pageData:null,requestTab:"mine",pageNumber:1,filters:{},detail:null};
    var modal = null;

    function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }

    function badge(s) { var names={DRAFT:"ร่าง",PENDING:"รออนุมัติ",APPROVED_ISSUED:"อนุมัติและจ่ายแล้ว",REJECTED:"ไม่อนุมัติ",CANCELLED:"ยกเลิก",COMPLETED:"เสร็จสิ้น",PROCESSING:"กำลังบันทึก",ACTIVE:"ใช้งาน",INACTIVE:"ปิดใช้งาน",NEAR_EXPIRY:"ใกล้หมดอายุ"}; return '<span class="badge rounded-pill badge-' + esc(s) + '">' + esc(names[s] || s) + '</span>'; }
    function overlay(show) { if ($.LoadingOverlay) { if (show) $.LoadingOverlay("show",{image:"",fontawesome:"fa fa-spinner fa-spin",fontawesomeColor:"#6958d8",size:35,background:"rgba(244,246,252,.5)"}); else $.LoadingOverlay("hide"); } }
    function call(action,payload,loading) { if (loading !== false) overlay(true); return fetch(API_URL,{method:"POST",redirect:"follow",body:JSON.stringify({action:action,payload:payload || {},token:state.token})}).then(function(r){return r.json();}).then(function(res){ if (loading !== false) overlay(false); if (!res.ok) throw new Error(res.error || "เกิดข้อผิดพลาด"); return res.data; }).catch(function(error){ if (loading !== false) overlay(false); var message=error && error.message ? error.message : String(error); if (message.indexOf("SESSION_EXPIRED") >= 0) { localStorage.removeItem("material_token"); state.token=""; showLogin(); } else if (message === "Failed to fetch") message="เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบ API_URL และการ Deploy"; Swal.fire({icon:"error",title:"ดำเนินการไม่สำเร็จ",text:message,confirmButtonColor:"#6958d8"}); throw error; }); }
    function alertOk(message) { return Swal.fire({icon:"success",title:"สำเร็จ",text:message,confirmButtonColor:"#6958d8",timer:1800}); }

    function buildMenu() { var allowed=menu.filter(function(m){return m.roles.indexOf(state.user.role)>=0;}); $("#sideMenu").html(allowed.map(function(m){return '<a class="nav-link ' + (state.page===m.id?'active':'') + '" href="#' + m.id + '" data-page="' + m.id + '"><i class="fa-solid ' + m.icon + '"></i><span>' + m.label + '</span></a>';}).join("")); }
    async function initializeApp() { overlay(true); try { if (!state.token) { overlay(false); showLogin(); return; } var result=await call("bootstrap",{},false); state.user=result.user; state.settings=result.settings; state.items=result.items; showApp(); await openPage(location.hash.slice(1) || "dashboard",false); } catch(e) { overlay(false); if (!state.user) showLogin(); } }
    async function openPage(name,showLoad) { if (!state.user) return; if (!menu.some(function(m){return m.id===name && m.roles.indexOf(state.user.role)>=0;})) name="dashboard"; state.page=name; buildMenu(); $("#pageTitle").text(menu.find(function(m){return m.id===name;}).label); $("#content").html('<div class="text-center py-5 text-secondary"><i class="fa-solid fa-spinner fa-spin me-2"></i>กำลังโหลดข้อมูล</div>'); closeSide(); var params={name:name,page:state.pageNumber}; Object.keys(state.filters).forEach(function(k){params[k]=state.filters[k];}); if (name==="dashboard") { params.from=state.filters.from || dateInput().slice(0,7) + "-01"; params.to=state.filters.to || dateInput(); } if (name==="stockcard" && !params.item_id) { renderStockCard(null); overlay(false); return; } try { var data=await call("page",params,showLoad!==false); state.pageData=data; renderPage(name,data); } catch(e) {} finally { overlay(false); } }
